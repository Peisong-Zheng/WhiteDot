name: Build desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.5.0 (leave empty for build artifacts)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.choose.outputs.tag }}
    steps:
      - id: choose
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            from_ref="${GITHUB_REF#refs/tags/}"
            if [[ -n "$tag" && "$tag" != "$from_ref" ]]; then
              echo "Choose a branch to create a new release tag, or use the selected tag." >&2
              exit 1
            fi
            tag="$from_ref"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}([-+][A-Za-z0-9.-]+)?$ ]] || ! git check-ref-format "refs/tags/$tag"; then
              echo "Use a version tag such as v0.5.0 or v0.5.0-beta.1." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            asset: dist/Folio-macos-*.zip
          - os: windows-2022
            platform: windows
            asset: dist/Folio-windows-*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: minimal
      - name: Build and smoke-test packaged application
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [target, build]
    if: needs.target.outputs.tag != ''
    concurrency:
      group: folio-release-${{ needs.target.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Folio-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Folio-* > SHA256SUMS.txt
      - name: Publish tagged binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.target.outputs.tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          ref="refs/tags/$RELEASE_TAG"
          existing="$(git ls-remote --refs origin "$ref")"
          if [[ -n "$existing" ]]; then
            git fetch --no-tags --depth=1 origin "$ref"
            tagged_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [[ "$tagged_commit" != "$commit" ]]; then
              echo "This tag already belongs to another commit. Choose a new version." >&2
              exit 1
            fi
          else
            git push origin "$commit:$ref"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes release-assets/*
          fi
