<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WhiteDot focus fixtures</title>
<style>
  body { font: 17px/1.5 system-ui; max-width: 660px; margin: 40px auto; }
  label, .field { display: block; margin: 20px 0; }
  input, textarea, [contenteditable] { box-sizing: border-box; width: 100%; margin: 4px 0; padding: 8px; border: 1px solid #888; border-radius: 4px; font: inherit; }
</style>
<h1>WhiteDot focus fixtures</h1>
<label>Single line <input value="There is a speling mistake."></label>
<label>Multiple lines <textarea rows="3">I saw teh dog.
🙂 I saw teh cat. She go home.</textarea></label>
<div class="field">Rich text
  <div role="textbox" aria-label="Rich text" contenteditable="true">This sentnce has a <b>bold</b> word.</div>
</div>
<label>Read-only <input readonly value="This read-only fixture has a typo: speling."></label>
<label>Password <input type="password" autocomplete="new-password" value="fixture-only"></label>
<button type="button">Leave the field</button>
</html>
