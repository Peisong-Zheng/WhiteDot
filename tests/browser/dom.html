<!doctype html><html lang="en"><meta charset="utf-8"><title>WhiteDot headless DOM fixture</title>
<style>body{padding:30px;font:18px monospace} input,textarea,[contenteditable]{font:18px monospace;display:block;margin:12px;width:260px;padding:8px;border:1px solid}textarea{height:70px}#rich{width:240px}</style>
<input id="single" value="😀 teh first"><textarea id="multi" wrap="soft"></textarea>
<div id="rich" contenteditable="true"><b>Keep</b> <i>teh</i> style.</div>
<input id="pass" type="password" value="fixture"><input id="payment" autocomplete="cc-number" value="test">
<pre id="result">WAIT</pre>
<script>
"use strict";
const calls = [];
let currentShadow;
const attach = Element.prototype.attachShadow;
Element.prototype.attachShadow = function(options) {
  const root = attach.call(this, options);
  if (options.mode === "closed") currentShadow = root;
  return root;
};
Object.defineProperty(document,"hasFocus",{value:() => true});
Object.defineProperty(document,"visibilityState",{value:"visible"});
const chromeStub = {
  runtime: {
    onMessage:{addListener() {}},
    async sendMessage(message) {
      calls.push({...message});
      if (message.kind === "ready") return {paired:true};
      const word = "teh";
      const index = (message.text || "").indexOf(word);
      const start = index < 0 ? 0 : [...message.text.slice(0,index)].length;
      return {active:true, issues:index < 0 ? [] : [
        {start, end:start+3, original:word, suggestions:["the"], explanation:"拼写"}
      ]};
    }
  }
};
window.chrome = chromeStub;
</script>
<script src="../../browser-extension/editor.js"></script><script src="../../browser-extension/content.js"></script>
<script>
const pause = n => new Promise(resolve => setTimeout(resolve,n));
const assert = (test,why) => {if (!test) throw new Error(why)};
const mark = () => currentShadow?.host.isConnected && currentShadow.querySelector(".mark");
async function waitFor(test,label) {
  for (let i=0; i<45 && !test(); ++i) await pause(35);
  assert(test(), label);
}
(async () => {
  const single=document.querySelector("#single"), multi=document.querySelector("#multi"), rich=document.querySelector("#rich");
  single.focus();
  await waitFor(mark,"input underline");
  let geometry=mark().getBoundingClientRect(), base=single.getBoundingClientRect();
  assert(geometry.left > base.left + 10 && geometry.right <= base.right && geometry.width>18,"input word geometry");
  mark().click();
  const oldChoice=currentShadow.querySelector(".card button");
  single.value="Now teh other revision.";
  oldChoice.click();
  assert(single.value==="Now teh other revision.","stale source guard");
  single.dispatchEvent(new Event("input",{bubbles:true}));
  await waitFor(mark,"updated input underline");
  let changes=0;
  single.addEventListener("input",()=>changes++);
  mark().click();currentShadow.querySelector(".card button").click();
  assert(single.value==="Now the other revision." && changes===1 && document.activeElement===single,"input replacement + focus");

  multi.value="A line that wraps across the field.\nAnother line.\nMore lines here.\nLast teh phrase.";
  multi.focus();multi.scrollTop=multi.scrollHeight;
  await waitFor(mark,"scrolled textarea underline");
  geometry=mark().getBoundingClientRect();base=multi.getBoundingClientRect();
  assert(geometry.top>=base.top && geometry.bottom<=base.bottom+1,"textarea clip");
  mark().click();currentShadow.querySelector(".card button").click();
  assert(multi.value.endsWith("Last the phrase."),"textarea replacement");

  rich.focus();
  await waitFor(mark,"rich underline");
  geometry=mark().getBoundingClientRect();
  const expected=new Range();expected.selectNodeContents(rich.querySelector("i"));
  assert(Math.abs(geometry.left-expected.getBoundingClientRect().left)<1,"rich word range");
  mark().click();currentShadow.querySelector(".card button").click();
  assert(rich.querySelector("b").textContent==="Keep" && rich.querySelector("i").textContent==="the","rich formatting");
  const counter=calls.filter(m=>m.text).length;
  document.querySelector("#pass").focus();await pause(140);
  document.querySelector("#payment").focus();await pause(140);
  assert(calls.filter(m=>m.text).length===counter && !mark(),"private fields");
  single.focus();single.dispatchEvent(new CompositionEvent("compositionstart",{bubbles:true}));await pause(140);
  assert(calls.filter(m=>m.text).length===counter,"IME composition");
  single.dispatchEvent(new CompositionEvent("compositionend",{bubbles:true}));
  await waitFor(()=>calls.filter(m=>m.text).length>counter,"resume after IME");
  document.querySelector("#result").textContent="PASS";
})().catch(e=>document.querySelector("#result").textContent="FAIL "+e.message);
</script></html>
